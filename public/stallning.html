<!DOCTYPE html>
<html lang="sv">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dalgardstipset</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" sizes="64x64" href="/icons/icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
</head>

<body>

<header class="site-header">
  <div class="site-header-inner">
    <a href="/" class="logo">
      <img src="icons/logo.png" alt="Dalgardstipset">
    </a>
    <button class="nav-toggle" id="nav-toggle" aria-label="Meny">
      ☰
    </button>
    <nav class="site-nav" id="site-nav">
      <a href="/" class="nav-link">Hem</a>
      <a href="mina-tips.html" class="nav-link">Mina tips</a>
      <a href="stallning.html" class="nav-link">Ställning</a>
      <a href="admin.html" class="nav-link">Admin</a>
      <button id="logout-btn" class="btn btn-danger">
        Logga ut
      </button>
    </nav>

  </div>
</header>


<main class="page">

  <h1 id="greeting"></h1>
  <section class="card">
    <div class="card-header">
      <div>
        <h2>Ställning</h2>
        <p class="section-description">
          Spelarnas totala poäng.
        </p>
      </div>
    </div>
    <div id="standings-list">
    </div>

  </section>



  <section class="card">
      <div class="card-header">
          <div>
              <h2>Poäng över tid</h2>
              <p class="section-description">
                  Se hur spelarnas poäng utvecklas under turneringen.
              </p>
          </div>
          <button onclick="pointsChart.resetZoom()" class="btn btn-secondary">Återställ</button>
      </div>

      <div class="chart-controls">
          <div class="chart-toggle">
              <button id="points-toggle" class="btn">Poäng</button>
              <button id="rank-toggle" class="btn btn-secondary">Placering</button>
          </div>

          <div class="chart-period">
              <button data-period="7" class="btn btn-secondary">7 dagar</button>
              <button data-period="30" class="btn btn-secondary">30 dagar</button>
              <button data-period="90" class="btn btn-secondary">3 månader</button>
              <button data-period="all" class="btn">Hela</button>
          </div>
      </div>

      <div class="chart-container">
          <canvas id="points-chart"></canvas>
      </div>
  </section>

  <section class="card">
    <div class="card-header">
      <div>
        <h2>Utslagsfrågor</h2>
        <p class="section-description">
          Se alla spelares svar på utslagsfrågorna.
        </p>
      </div>
    </div>
    <div id="knockout-questions">
    </div>
  </section>

  <section class="card">
    <div class="card-header">
      <div>
        <h2>Alla matcher</h2>

        <p class="section-description">
          Se alla spelares tips och poäng för alla matcher.
        </p>
      </div>
    </div>
    <div id="all-predictions">
    </div>
  </section>


</main>

<div id="prediction-modal" class="prediction-modal" aria-hidden="true">
    <div class="prediction-modal-backdrop"></div>

    <div class="prediction-modal-content" role="dialog" aria-modal="true">
        <button
            type="button"
            class="prediction-modal-close"
            id="prediction-modal-close"
            aria-label="Stäng"
        >
            ×
        </button>

        <div id="prediction-modal-body"></div>
    </div>
</div>


<script src="js/shared/nav.js"></script>
<script src="js/shared/auth-guard.js"></script>
<script src="js/shared/greeting.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.2.0"></script>
<script src="js/stallning/stallning.js"></script>

</body>
</html>
