<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dalgardstipset</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" sizes="64x64" href="/icons/icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
</head>

<body>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<header class="site-header">
  <div class="site-header-inner">
    <a href="/" class="logo">
      <img src="icons/logo.png" alt="Dalgardstipset">
    </a>
    <button class="nav-toggle" id="nav-toggle" aria-label="Meny">☰</button>
    <nav class="site-nav" id="site-nav">
      <a href="/" class="nav-link">Hem</a>
      <a href="mina-tips.html" class="nav-link">Mina tips</a>
      <a href="admin.html" class="nav-link">Admin</a>
      <button id="logout-btn" class="btn btn-danger">Logga ut</button>
    </nav>
  </div>
</header>
  <main class="page">


    <div class="admin-content">

      <!-- Spelare -->
      <section class="card">
        <h2>Spelare</h2>

        <ul id="user-list" class="item-list"></ul>

        <button class="btn" id ="btn-show-edit-user-list"> Skapa spelare </button>
        <div class="card-form" id = "user-list-card" hidden>
          <h3 id="user-form-title">Skapa spelare</h3>

          <form id="user-form">
          <input type="hidden" id="user-id">


            <div class="form-group">
              <label for="user-username">Användarnamn</label>
              <input type="text" id="user-username" required>
            </div>

            <div class="form-group">
              <label for="user-password">Lösenord</label>
              <input type="text" id="user-password">
              <small id="password-help">Krävs när en ny spelare skapas</small>
            </div>

            <div class="form-group form-checkbox">
              <label>
                <input type="checkbox" id="user-is-admin">
                Admin
              </label>
            </div>

            <button type="submit" class="btn", id = "user-submit-btn">
              Skapa spelare
            </button>

            <button type="button" id="delete-edit-user-btn" class="btn btn-danger" hidden>Radera spelare</button>
            <button type="button" id="cancel-edit-user-btn" class="btn btn-secondary" hidden>Avbryt</button>
            <button type="button" id="cancel-card-user-layout" class="btn btn-secondary" hidden>Avbryt</button>


            <p id="user-error-message" class="error"></p>

          </form>
        </div>
      </section>


      <!-- Turneringar -->
      <section class="card">
        <h2>Turneringar</h2>

        <ul id="tournament-list" class="item-list"></ul>
        <button class="btn" id ="btn-show-edit-to-list"> Skapa turnering </button>
        <div class="card-form" id = "to-list-card" hidden>
          <h3 id="tournament-form-title">Skapa ny turnering</h3>
          <form id="tournament-form">

            <div class="form-group">
              <label for="name">Namn</label>
              <input type="text" id="name" name="name" required>
            </div>

            <div class="form-group">
              <label for="start_date">Startdatum</label>
              <input type="date" id="start_date" name="start_date">
            </div>

            <button type="submit" class="btn" id="tournament-submit-btn">
              Skapa
            </button>
            
            <button type="button" id="delete-tournament-btn" class="btn btn-danger" hidden>
              Radera turnering
            </button>
            <button type="button" id="cancel-tournament-edit-btn" class="btn btn-secondary" hidden>
              Avbryt
            </button>

            <button type="button" id="cancel-card-tu-layout" class="btn btn-secondary" hidden>Avbryt</button>
            <p id="error-message" class="error"></p>

          </form>
        </div>
      </section>


      <!-- Lag -->
      <section class="card">
        <h2>Lag</h2>

        <div class="form-group">
          <label for="tournament-select">Turnering</label>
          <select id="tournament-select"></select>
        </div>

        <ul id="team-list" class="item-list"></ul>

        <div class="card-form">
          <h3>Lägg till lag</h3>

          <form id="team-form">

            <div class="form-group">
              <label for="team-name">Lagnamn</label>
              <input
                type="text"
                id="team-name"
                name="team-name"
                required
              >
            </div>

            <div class="form-group">
              <label for="team-group">Grupp</label>
              <input
                type="text"
                id="team-group"
                name="team-group"
                maxlength="1"
                placeholder="T.ex. A"
              >
            </div>

            <button type="submit" class="btn">
              Lägg till
            </button>

            <p id="team-error-message" class="error"></p>

          </form>
        </div>
      </section>


      <!-- Matcher -->
      <section class="card">
        <h2>Matcher</h2>

        <ul id="match-list" class="item-list"></ul>

        <div class="card-form">
          <h3>Lägg till match</h3>

          <form id="match-form">

            <div class="form-group">
              <label for="home-team">Hemmalag</label>
              <select id="home-team"></select>
            </div>

            <div class="form-group">
              <label for="away-team">Bortalag</label>
              <select id="away-team"></select>
            </div>

            <div class="form-group">
              <label for="kickoff">Avspark</label>
              <input type="datetime-local" id="kickoff" required>
            </div>

            <button type="submit" class="btn">
              Lägg till match
            </button>

            <p id="match-error-message" class="error"></p>

          </form>
        </div>
      </section>

    </div>

  </main>

  <script src="js/toast.js"></script>
  <script src="js/auth-guard.js"></script>
  <script type="module" src="js/admin/admin.js"></script>

</body>
</html>
