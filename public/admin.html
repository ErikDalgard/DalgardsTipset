<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dalgardstipset</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" sizes="64x64" href="/icons/icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
</head>

<body>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<header class="site-header">
  <div class="site-header-inner">
    <a href="/" class="logo">
      <img src="icons/logo.png" alt="Dalgardstipset">
    </a>
    <button class="nav-toggle" id="nav-toggle" aria-label="Meny">☰</button>
    <nav class="site-nav" id="site-nav">
      <a href="/" class="nav-link">Hem</a>
      <a href="mina-tips.html" class="nav-link">Mina tips</a>
      <a href="stallning.html" class="nav-link">Ställning</a>
      <a href="admin.html" class="nav-link">Admin</a>
      <button id="logout-btn" class="btn btn-danger">Logga ut</button>
    </nav>
  </div>
</header>
  <main class="page">


    <div class="admin-content">

      <!-- Spelare -->
      <section class="card">
        <h2>Spelare</h2>

        <ul id="user-list" class="item-list"></ul>

        <button class="btn" id ="btn-show-edit-user-list"> Skapa spelare </button>
        <div class="card-form" id = "user-list-card" hidden>
          <h3 id="user-form-title">Skapa spelare</h3>

          <form id="user-form">
          <input type="hidden" id="user-id">


            <div class="form-group">
              <label for="user-username">Användarnamn</label>
              <input type="text" id="user-username" required>
            </div>

            <div class="form-group">
              <label for="user-password">Lösenord</label>
              <input type="text" id="user-password">
              <small id="password-help">Krävs när en ny spelare skapas</small>
            </div>

            <div class="form-group form-checkbox">
              <label>
                <input type="checkbox" id="user-is-admin">
                Admin
              </label>
            </div>

            <button type="submit" class="btn", id = "user-submit-btn">
              Skapa spelare
            </button>

            <button type="button" id="delete-edit-user-btn" class="btn btn-danger" hidden>Radera spelare</button>
            <button type="button" id="cancel-edit-user-btn" class="btn btn-secondary" hidden>Avbryt</button>
            <button type="button" id="cancel-card-user-layout" class="btn btn-secondary" hidden>Avbryt</button>


            <p id="user-error-message" class="error"></p>

          </form>
        </div>
      </section>


      <!-- Turneringar -->
      <section class="card">
        <h2>Turneringar</h2>

        <ul id="tournament-list" class="item-list"></ul>
        <button class="btn" id ="btn-show-edit-to-list"> Skapa turnering </button>
        <div class="card-form" id = "to-list-card" hidden>
          <h3 id="tournament-form-title">Skapa ny turnering</h3>
          <form id="tournament-form">

            <div class="form-group">
              <label for="name">Namn</label>
              <input type="text" id="name" name="name" required>
            </div>

            <div class="form-group">
              <label for="start_date">Startdatum</label>
              <input type="date" id="start_date" name="start_date">
            </div>
            <h4>Poäng: </h4>
            <div class="form-group">
              <label for="rule-exact_score">Rätt resultat</label>
              <input type="number" id="rule-exact_score" min="0">
          </div>
            <div class="form-group">
              <label for="rule-correct_diff">Rätt målskillnad</label>
              <input type="number" id="rule-correct_diff" min="0">
            </div>
            <div class="form-group">
              <label for="rule-correct_winner">Rätt vinnare/oavgjort</label>
              <input type="number" id="rule-correct_winner" min="0">
            </div>
            <div class="form-group checkbox-group">
              <label>
                <input type="checkbox" id="active" name="active" value="1">
                Aktiv turnering
              </label>
            </div>

            <button type="submit" class="btn" id="tournament-submit-btn">
              Spara
            </button>
            
            <button type="button" id="delete-tournament-btn" class="btn btn-danger" hidden>
              Radera turnering
            </button>
            <button type="button" id="cancel-tournament-edit-btn" class="btn btn-secondary" hidden>
              Avbryt
            </button>

            <button type="button" id="cancel-card-tu-layout" class="btn btn-secondary" hidden>Avbryt</button>
            <p id="error-message" class="error"></p>

          </form>
        </div>
      </section>


      <!-- Lag -->
      <section class="card">
        <h2>Lag</h2>

        <div class="form-group">
          <label for="tournament-select">Turnering</label>
          <select id="tournament-select"></select>
        </div>

        <ul id="team-list" class="item-list"></ul>
        <button class="btn" id="create-team-btn">Lägg till lag</button>
        <button class="btn btn-secondary" id="edit-team-btn">Redigera lag</button>

        <div class="card-form" id="edit-team-card" hidden>
          <h3>Redigera lag</h3>
          <div class="form-group">
            <label for="team-search">Sök lag</label>
            <input type="text" id="team-search" placeholder="Skriv lagnamn">
          </div>
          <ul id="team-search-list" class="item-list"></ul>
          <button type="button" id="cancel-edit-team-search" class="btn btn-secondary">Avbryt</button>
        </div>

        <div class="card-form" id = "create-team-card" hidden>

          <form id="team-form">

            <div class="form-group">
              <label for="team-name">Lagnamn</label>
              <input
                type="text"
                id="team-name"
                name="team-name"
                required
              >
            </div>

            <div class="form-group">
              <label for="team-group">Grupp</label>
              <input
                type="text"
                id="team-group"
                name="team-group"
                maxlength="1"
                placeholder="T.ex. A"
              >
            </div>

            <button type="submit" class="btn">
              Spara
            </button>
            <button type="button" id="delete-edit-team-btn" class="btn btn-danger" hidden>Radera lag</button>
            <button type="button" id="cancel-create-team" class="btn btn-secondary" hidden>Avbryt</button>

            <p id="team-error-message" class="error"></p>

          </form>
        </div>
      </section>


    <!-- Matcher -->
    <section class="card">
      <h2>Matcher</h2>

      <div id="match-list" class="match-list"></div>

      <button class="btn" id="create-match-btn">
        Lägg till match
      </button>
      <button class="btn btn-secondary" id="edit-match-btn">Redigera match</button>

      <!-- SKAPA MATCH -->
      <div class="card-form" id="create-match-card" hidden>

        <form id="match-form">

          <div class="form-group">
            <label for="home-team">Hemmalag</label>
            <select id="home-team"></select>
          </div>

          <div class="form-group">
            <label for="away-team">Bortalag</label>
            <select id="away-team"></select>
          </div>

          <div class="form-group">
            <label for="kickoff">Avspark</label>
            <input
              type="datetime-local"
              id="kickoff"
              required
            >
          </div>

          <button type="submit" class="btn" id="match-submit-btn">
            Lägg till match
          </button>

          <button
            type="button"
            id="cancel-create-match"
            class="btn btn-secondary"
            hidden
          >
            Avbryt
          </button>

          <p id="match-error-message" class="error"></p>

        </form>
      </div>
    </section>
    </div>
  
          <!-- Utslagsfrågor -->
    <section class="card">
      <h2>Utslagsfrågor</h2>

      <ul id="question-list" class="item-list"></ul>

      <button class="btn" id ="btn-edit-question"> Skapa fråga</button>
      <div class="card-form" id = "question-list-card" hidden>
        <form id="question-form">
        <input type="hidden" id="question-id">

          <div class="form-group">
            <label for="question">Fråga</label>
            <input type="text" id="question" required>
          </div>

          <div class="form-group">
            <label for="question-points">Poäng</label>
            <input
              type="number"
              id="question-points"
              min="0"
              step="1"
              required
            >
          </div>

          <button type="submit" class="btn", id = "question-submit-btn">
            Spara
          </button>

          <button type="button" id="delete-edit-question-btn" class="btn btn-danger" hidden>Radera fråga</button>
          <button type="button" id="cancel-edit-question-btn" class="btn btn-secondary" hidden>Avbryt</button>
          <button type="button" id="cancel-card-question-layout" class="btn btn-secondary" hidden>Avbryt</button>


          <p id="question-error-message" class="error"></p>

        </form>
      </div>
    </section>

  </main>

  <script src="js/shared/toast.js"></script>
  <script src="js/shared/nav.js"></script>
  <script src="js/shared/auth-guard.js"></script>
  <script type="module" src="js/admin/admin.js"></script>

</body>
</html>
