<!DOCTYPE html>
<html lang="sv">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dalgardstipset</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" sizes="64x64" href="/icons/icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
</head>

<body>

<header class="site-header">
  <div class="site-header-inner">
    <a href="/" class="logo">
      <img src="icons/logo.png" alt="Dalgardstipset">
    </a>
    <button class="nav-toggle" id="nav-toggle" aria-label="Meny">☰</button>
    <nav class="site-nav" id="site-nav">
      <a href="/" class="nav-link">Hem</a>
      <a href="mina-tips.html" class="nav-link">Mina tips</a>
      <a href="stallning.html" class="nav-link">Ställning</a>
      <a href="admin.html" class="nav-link">Admin</a>
      <button id="logout-btn" class="btn btn-danger">Logga ut</button>
    </nav>
  </div>
</header>

<main class="page">
  <h1 id="greeting"></h1>

  <section class="card">

    <div class="card-header">
      <div>
        <h2>Dagens matcher</h2>
        <p class="section-description">
          Se ditt tips och hur de andra har tippat.
        </p>
      </div>
    </div>

    <div id="todays-matches">
    </div>

  </section>


  <section class="home-overview">
    <div class="card home-score-card clickable" id="user-score-card">
      <h2>Din ställning</h2>
      <div class="score-main">
        <span id="user-points">0</span>
        <span class="score-label">poäng</span>
      </div>

      <div class="score-position">
        Plats <strong id="user-position">–</strong>
      </div>
    </div>


    <section class="card">
      <div class="card-header">
        <div>
          <h2>Snart dags att tippa</h2>
          <p class="section-description">
            Dina kommande 3 otippade matcher.
          </p>
        </div>
      </div>

      <ul id="next-tips-list" class="list">
      </ul>

    </section>

  </section>


</main>

  <script src="js/shared/nav.js"></script>
  <script src="js/shared/auth-guard.js"></script>
  <script src="js/shared/greeting.js"></script>
  <script src="js/index/index.js"></script>

</body>
</html>
